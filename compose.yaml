services:
    mongodb:
        image: mongo:latest
        container_name: nammongodb

        ports:
            - "27017:27017"

        volumes:
            - mongodb_data:/data/db

        healthcheck:
            test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

    product-api:
        build: .
        container_name: product-api-container

        ports:
            - "3000:3000"

        env_file:
            - .env

        depends_on:
            mongodb:
                condition: service_healthy

        healthcheck:
            test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

volumes:
    mongodb_data:
