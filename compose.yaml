services:
    mongodb:
        image: mongo:latest
        container_name: nammongodb
        ports:
            - "27017:27017"
        volumes:
            - mongodb_data:/data/db

    product-api:
        build: .
        container_name: product-api-container
        ports:
            - "3000:3000"
        env_file:
            - .env
        depends_on:
            - mongodb

volumes:
    mongodb_data:
