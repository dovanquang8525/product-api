name: Product API CI

on:
    push:
        branches:
            - main

    pull_request:
        branches:
            - main

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout source code
              uses: actions/checkout@v6

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: "22"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Check Node.js syntax
              run: |
                  node --check server.js
                  node --check models/Product.js
                  node --check routes/productRoutes.js

            - name: Build Docker image
              run: docker build -t product-api .
